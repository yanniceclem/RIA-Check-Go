<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard - RIA Check & Go</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>body{padding:18px}</style>
</head>
<body>
  <header class="site-header"><h1>RIA Check & Go — Dashboard</h1></header>
  <main class="container card">
    <div id="auth">
      <h2>Connexion</h2>
      <form id="loginForm">
        <label>Email<input name="email" required /></label>
        <label>Mot de passe<input name="password" type="password" required /></label>
        <div class="actions"><button>Se connecter</button></div>
      </form>
      <div id="loginResult"></div>
    </div>

    <section id="adminArea" style="display:none">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <a href="/sgr.html" class="btn">Ouvrir SGR (plans d'action)</a>
        <div style="color:#666;font-size:0.9em">Gérer plans, tâches et assignations</div>
      </div>
      <h2>Diagnostics récents</h2>
      <div id="diagnosticsList">Chargement...</div>
      <h3>Utilisateurs</h3>
      <div id="usersList">Chargement...</div>
      <div class="card">
        <h4>Créer un utilisateur</h4>
        <form id="createUserForm">
          <label>Nom<input name="name" required /></label>
          <label>Email<input name="email" type="email" required /></label>
          <label>Mot de passe<input name="password" type="password" required /></label>
          <label>Rôle
            <select name="role">
              <option value="user">user</option>
              <option value="auditor">auditor</option>
              <option value="admin">admin</option>
            </select>
          </label>
          <div class="actions"><button type="submit">Créer</button></div>
        </form>
        <div id="createUserResult"></div>
      </div>
      <h3>Incidents récents</h3>
      <div id="incidentsList">Chargement...</div>
      <h3>Logs système</h3>
      <div id="logsList">Chargement...</div>
      <div style="margin-top:12px"><button id="logout">Se déconnecter</button></div>
    </section>
  </main>
  <script src="assets/admin.js"></script>
</body>
</html>
